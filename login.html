<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Query Bench — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="js/auth.js"></script>

  <style>
    :root{
      --ink:#0B1220;
      --panel:#101A2B;
      --panel-raised:#152037;
      --line:#22304A;
      --text:#E4E9F2;
      --text-dim:#8996AC;
      --text-faint:#5E6C85;
      --pk:#D4A657;
      --fk:#5B8DEF;
      --ok:#4ADE80;
      --err:#F87171;
      --err-dim:#3B1F22;
      --font-head:'Space Grotesk',sans-serif;
      --font-body:'IBM Plex Sans',sans-serif;
      --font-code:'IBM Plex Mono',monospace;
    }

    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:var(--ink);
      color:var(--text);
      font-family:var(--font-body);
      background-image:
        linear-gradient(var(--line) 1px,transparent 1px),
        linear-gradient(90deg,var(--line) 1px,transparent 1px);
      background-size:28px 28px;
    }

    .auth-shell{
      width:min(440px,100%);
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin-bottom:22px;
    }
    .brand-mark{
      width:38px;height:38px;border-radius:8px;
      background:linear-gradient(135deg,var(--pk),var(--fk));
      display:flex;align-items:center;justify-content:center;
      color:#0B1220;font-family:var(--font-code);font-weight:600;
    }
    .brand-name{
      font-family:var(--font-head);
      font-size:22px;
      font-weight:600;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      padding:28px;
      box-shadow:0 18px 55px rgba(0,0,0,.25);
    }

    .eyebrow{
      color:var(--text-faint);
      font-family:var(--font-code);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:7px;
    }
    h1{
      margin:0;
      font-family:var(--font-head);
      font-size:27px;
      line-height:1.2;
    }
    .subtitle{
      margin:8px 0 22px;
      color:var(--text-dim);
      line-height:1.55;
      font-size:14px;
    }

    .google-btn,.primary-btn,.secondary-btn{
      width:100%;
      border-radius:8px;
      min-height:44px;
      cursor:pointer;
      font-family:var(--font-body);
      font-size:14px;
      font-weight:500;
    }

    /* Google-generated Sign in with Google button */
    .gsi-material-button{
      width:100%;
      height:44px;
      background:#fff;
      border:1px solid #747775;
      border-radius:4px;
      box-sizing:border-box;
      cursor:pointer;
      padding:0;
      position:relative;
      transition:background-color .2s,box-shadow .2s;
      color:#3c4043;
    }

    .gsi-material-button:hover{
      background:#f8fafd;
      box-shadow:0 1px 2px rgba(60,64,67,.30),
                 0 1px 3px 1px rgba(60,64,67,.15);
    }

    .gsi-material-button:active{
      background:#f1f3f4;
    }

    .gsi-material-button:focus-visible{
      outline:2px solid var(--fk);
      outline-offset:2px;
    }

    .gsi-material-button-state{
      position:absolute;
      inset:0;
      border-radius:4px;
      pointer-events:none;
    }

    .gsi-material-button-content-wrapper{
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
      position:relative;
    }

    .gsi-material-button-icon{
      width:18px;
      height:18px;
      margin-right:12px;
      flex:none;
    }

    .gsi-material-button-icon svg{
      width:18px;
      height:18px;
      display:block;
    }

    .gsi-material-button-contents{
      font-family:Arial,sans-serif;
      font-size:14px;
      font-weight:500;
      color:#3c4043;
      letter-spacing:.25px;
    }

    .google-btn:hover,.secondary-btn:hover{
      border-color:var(--fk);
    }

    .divider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:20px 0;
      color:var(--text-faint);
      font-family:var(--font-code);
      font-size:11px;
    }
    .divider:before,.divider:after{
      content:"";
      height:1px;
      flex:1;
      background:var(--line);
    }

    label{
      display:block;
      margin:0 0 7px;
      color:var(--text-dim);
      font-size:12.5px;
    }
    input{
      width:100%;
      height:44px;
      padding:0 12px;
      margin-bottom:14px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--ink);
      color:var(--text);
      outline:none;
      font-family:var(--font-body);
      font-size:14px;
    }
    input:focus{
      border-color:var(--fk);
      box-shadow:0 0 0 3px rgba(91,141,239,.12);
    }

    .primary-btn{
      border:1px solid var(--pk);
      background:var(--pk);
      color:#1A1204;
      margin-top:3px;
    }
    .primary-btn:hover{filter:brightness(1.08)}

    .secondary-btn{
      border:1px solid var(--line);
      background:transparent;
      color:var(--text-dim);
      margin-top:10px;
    }

    .form-footer{
      display:flex;
      justify-content:flex-end;
      margin-top:10px;
    }
    .text-btn{
      border:0;
      background:none;
      color:var(--fk);
      cursor:pointer;
      padding:0;
      font:12px var(--font-code);
    }
    .text-btn:hover{text-decoration:underline}

    .switch{
      margin-top:20px;
      text-align:center;
      color:var(--text-dim);
      font-size:13px;
    }
    .switch button{
      border:0;background:none;color:var(--fk);cursor:pointer;
      font:500 13px var(--font-body);
    }

    .message{
      display:none;
      margin-bottom:14px;
      padding:10px 12px;
      border-radius:8px;
      font-size:12.5px;
      line-height:1.45;
    }
    .message.open{display:block}
    .message.error{
      color:var(--err);
      background:var(--err-dim);
      border:1px solid rgba(248,113,113,.35);
    }
    .message.success{
      color:var(--ok);
      background:#1F3B2C;
      border:1px solid rgba(74,222,128,.3);
    }

    .signup-only{display:none}
    body.signup-mode .signup-only{display:block}
    body.signup-mode .login-only{display:none}
    body.signup-mode #form-title{display:none}
    body.signup-mode #signup-title{display:block}
    #signup-title{display:none}

    .loading{
      opacity:.65;
      pointer-events:none;
    }

    .terms{
      color:var(--text-faint);
      text-align:center;
      font-size:10.5px;
      line-height:1.5;
      margin-top:18px;
    }

    @media(max-width:480px){
      body{padding:14px}
      .card{padding:22px 18px}
    }
  </style>
</head>

<body>
  <div class="auth-shell">
    <div class="brand">
      <div class="brand-mark">SQL</div>
      <div class="brand-name">Query Bench</div>
    </div>

    <section class="card">
      <div class="eyebrow">SQL interview practice</div>
      <h1 id="form-title">Welcome back</h1>
      <h1 id="signup-title">Create your account</h1>
      <p class="subtitle" id="subtitle">Sign in to continue practicing SQL.</p>

      <div class="message" id="message"></div>

      <button class="gsi-material-button" id="google-btn" type="button">
        <div class="gsi-material-button-state"></div>

        <div class="gsi-material-button-content-wrapper">
          <div class="gsi-material-button-icon">
            <svg version="1.1"
                 xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 48 48"
                 xmlns:xlink="http://www.w3.org/1999/xlink"
                 style="display:block;">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
              <path fill="none" d="M0 0h48v48H0z"></path>
            </svg>
          </div>

          <span class="gsi-material-button-contents">Sign in with Google</span>
          <span style="display:none;">Sign in with Google</span>
        </div>
      </button>

      <div class="divider">OR</div>

      <form id="auth-form">
        <div class="signup-only">
          <label for="display-name">Name</label>
          <input id="display-name" type="text" autocomplete="name" placeholder="Your name">
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters">
        </div>

        <div class="form-footer login-only">
          <button class="text-btn" id="forgot-btn" type="button">Forgot password?</button>
        </div>

        <button class="primary-btn" id="submit-btn" type="submit">Sign in</button>
      </form>

      <button class="secondary-btn" id="switch-btn" type="button">Create an account</button>

      <div class="switch">
        <span id="switch-copy">Don't have an account?</span>
        <button id="switch-inline" type="button">Create account</button>
      </div>

      <div class="terms">
        Your account is securely managed by Firebase Authentication.
      </div>
    </section>
  </div>

  <script>
    (function(){
      "use strict";

      var body = document.body;
      var form = document.getElementById("auth-form");
      var email = document.getElementById("email");
      var password = document.getElementById("password");
      var nameInput = document.getElementById("display-name");
      var submitBtn = document.getElementById("submit-btn");
      var googleBtn = document.getElementById("google-btn");
      var forgotBtn = document.getElementById("forgot-btn");
      var switchBtn = document.getElementById("switch-btn");
      var switchInline = document.getElementById("switch-inline");
      var message = document.getElementById("message");
      var subtitle = document.getElementById("subtitle");
      var switchCopy = document.getElementById("switch-copy");
      var signupMode = false;

      function showMessage(text, type){
        message.textContent = text;
        message.className = "message open " + type;
      }

      function clearMessage(){
        message.textContent = "";
        message.className = "message";
      }

      function setLoading(loading){
        var card = document.querySelector(".card");
        if (loading){
          card.classList.add("loading");
        } else {
          card.classList.remove("loading");
        }
      }

      function setMode(signup){
        signupMode = signup;
        body.classList.toggle("signup-mode", signup);
        subtitle.textContent = signup
          ? "Create an account to save your Query Bench profile."
          : "Sign in to continue practicing SQL.";
        submitBtn.textContent = signup ? "Create account" : "Sign in";
        switchBtn.textContent = signup ? "Back to sign in" : "Create an account";
        switchCopy.textContent = signup ? "Already have an account?" : "Don't have an account?";
        switchInline.textContent = signup ? "Sign in" : "Create account";
        password.setAttribute("autocomplete", signup ? "new-password" : "current-password");
        clearMessage();
      }

      function redirectAfterAuth(){
        window.location.replace("index.html");
      }

      switchBtn.addEventListener("click", function(){ setMode(!signupMode); });
      switchInline.addEventListener("click", function(){ setMode(!signupMode); });

      form.addEventListener("submit", function(e){
        e.preventDefault();
        clearMessage();

        var emailValue = email.value.trim();
        var passwordValue = password.value;
        var nameValue = nameInput.value.trim();

        if (!emailValue || !passwordValue){
          showMessage("Enter your email and password.", "error");
          return;
        }

        setLoading(true);

        var action = signupMode
          ? window.QueryBenchAuth.signUp(emailValue, passwordValue, nameValue)
          : window.QueryBenchAuth.signIn(emailValue, passwordValue);

        action.then(function(){
          redirectAfterAuth();
        }).catch(function(err){
          showMessage(window.QueryBenchAuth.friendlyError(err), "error");
          setLoading(false);
        });
      });

      googleBtn.addEventListener("click", function(){
        clearMessage();
        setLoading(true);

        window.QueryBenchAuth.signInWithGoogle()
          .then(function(){ redirectAfterAuth(); })
          .catch(function(err){
            showMessage(window.QueryBenchAuth.friendlyError(err), "error");
            setLoading(false);
          });
      });

      forgotBtn.addEventListener("click", function(){
        clearMessage();
        var emailValue = email.value.trim();

        if (!emailValue){
          showMessage("Enter your email first, then click Forgot password.", "error");
          email.focus();
          return;
        }

        setLoading(true);
        window.QueryBenchAuth.resetPassword(emailValue)
          .then(function(){
            showMessage("Password reset email sent. Check your inbox.", "success");
            setLoading(false);
          })
          .catch(function(err){
            showMessage(window.QueryBenchAuth.friendlyError(err), "error");
            setLoading(false);
          });
      });

      // If the user is already signed in, don't show the login form again.
      if (window.QueryBenchAuth && window.QueryBenchAuth.auth){
        window.QueryBenchAuth.auth.onAuthStateChanged(function(user){
          if (user) redirectAfterAuth();
        });
      }
    })();
  </script>
</body>
</html>
